services:

  postgres:
    image: postgres:16
    container_name: rag_postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Pelatuk123
      POSTGRES_DB: ragdb

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"


  backend:
    build: ./backend

    container_name: rag_backend

    restart: always

    environment:
      - PYTHONPATH=/app/app

    env_file:
      - ./backend/.env

    volumes:
      - ./backend/chroma_db:/app/chroma_db
      - ./backend/data:/app/data

    depends_on:
      - postgres

    ports:
      - "8000:8000"


  frontend:
    build: ./frontend

    container_name: rag_frontend

    restart: always

    depends_on:
      - backend

    ports:
      - "3000:80"


volumes:
  postgres_data:
